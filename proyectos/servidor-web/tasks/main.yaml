
# Instalación del aapache
- name:                 Asegurar que el apache queda instalado
  ansible.builtin.include_tasks:
  # En nuestro caso no me interesa la distro: 
  # Las distros son del tipo: "Ubuntu Mint", "XUbuntu", "Rocky", "AlmaLinux".
  # Lo que me interesa es la familia de la distro: "Ubuntu", "RedHat"
    file:                   "{{ familia_sistema_operativo }}/tareas-instalacion-paquete.yaml"
    apply:                  # Añade dinamicamente el tag "instalacion" a todas las tareas incluidas
      tags:
        -                   instalacion # Con esto me aseguro que las tareas de dentro del fichero también tengan el tag "instalacion"
                                        # Para que cuando se solicite que se ejecuten las tareas con el tag "instalacion", también se ejecuten las tareas incluidas en este fichero
  vars:
    package:
      name:                "{{ nombre_paquete_apache[familia_sistema_operativo] }}" # httpd | apache2
      version:
        name:              "{{ apache[familia_sistema_operativo].version.name | default(apache.version.name) | default('', true) }}"
        matching:          "{{ apache[familia_sistema_operativo].version.matching | default(apache.version.matching) | default('', true) }}"
      repo:
        name:               "{{ apache[familia_sistema_operativo].repo.name | default('', true) }}"
        url:                "{{ apache[familia_sistema_operativo].repo.url | default('', true) }}"
        gpgkey:             "{{ apache[familia_sistema_operativo].repo.gpgkey | default('', true) }}"
  tags:
    -                       instalacion # Con este tag me aseguro que en caso de que pidan instalacion, se 
                              # solicite la ejecución de las tareas de dentro de ese fichero

# Configuración del apache
- name:                 Asegurar que el apache queda configurado
  ansible.builtin.template:
    src:                    templates/plantilla-virtual-host.j2
    dest:                   "{{ carpetas_configuracion_apache[familia_sistema_operativo] }}/despliegue.conf"
    backup:                 true
    mode:                   '0644'
  vars:
    puerto:                  "{{ aplicacion_a_desplegar.puerto_apache }}"
    dominio:                 "{{ aplicacion_a_desplegar.nombre_dominio }}"
    carpeta:                 "{{ aplicacion_a_desplegar.carpeta_despliegue }}"
    configuracion_adicional: "{{ aplicacion_a_desplegar.configuracion_apache }}"
  notify:                   CONFIGURACION_DE_APACHE_CAMBIADA # Evento que la tarea lanza CUANDO PROVOCA CAMBIO
  become:                   true
  tags:
    -                       configuracion

# Despliegue del apache
- name:                 Asegurar que la aplicación web quede desplegada
  block:
    # En un proyecto real, en lugar de extraero de git, lo extaería de un Registro: NEXUS, ARTIFACTORY
    # Pero sería el mismo procedimiento, con otro módulo. Y descargaría en una carpeta temporal
    # Y luego miro si es lo mismo que hay desplegado o no
    # La diferencia en nuestro caso, es que al trabajar con git, no querremos copiar la carpeta .git
    - name:             Asegurar que no existe la carpeta .git en el repo descargado
      ansible.builtin.file:
        path:           "/tmp/{{ aplicacion_a_desplegar.nombre_dominio }}"
        state:          absent
      tags:
        - despliegue

    - name:             Asegurar que el repositorio de la aplicación web quede clonado en una carpeta temporal en la última versión
      ansible.builtin.git:
        repo:           "{{ aplicacion_a_desplegar.repo_git }}"
        dest:           "/tmp/{{ aplicacion_a_desplegar.nombre_dominio }}"
        force:          true
      tags:
        - despliegue

    - name:             Asegurar que no existe la carpeta .git en el repo descargado
      ansible.builtin.file:
        path:           "/tmp/{{ aplicacion_a_desplegar.nombre_dominio }}/.git"
        state:          absent
      tags:
        - despliegue

    - name:             Asegurar que la carpeta de despliegue quede creada con los permisos adecuados
      ansible.builtin.file:
        path:           "{{aplicacion_a_desplegar.carpeta_despliegue }}"
        state:          directory
        mode:           '0755'
      become:           true
      tags:
        - despliegue

    - name:             Comprueba si los archivos de la aplicación web desplegada coinciden con los que he descargado
      ansible.posix.synchronize:
        src:            "/tmp/{{ aplicacion_a_desplegar.nombre_dominio }}/"
        dest:           "{{ aplicacion_a_desplegar.carpeta_despliegue }}"
        delete:         true
      check_mode:       true    # Se ejecuta la tarea en modo dry-run. 
                                # Es decir realmente la tarea NO SE EJECUTA, solo simula los cambios que haría.
                                # Eso si.. el estado de la tarea lo que reflejará es si habría habido cambios o no
                                # En caso de que la tarea relamente se hubiera aplicado.
                                # Esto no hace el RSYNC realmente, solo simula lo que haría.
                                # NOTA: NO TODOS LOS MODULOS DE ANSIBLE SOPORTAN EL CHECKMODE
                                # Hay que tener cuidado
      delegate_to:      "{{ inventory_hostname }}"  # Nodo destino... así la carpeta src se toma del nodo de destino
      # Cuál es la dirección IP o nombre del nodo de destino en el que estamos ejecutando el playbook: 
      # Ansible me regala una variable con ese dato: inventory_hostname
      become:           true
      register:         sync_result
      tags:
        - despliegue

    - name:             LUPA - Qué me ha dicho el synchronize simulado
      # Esta es la variable de la que cuelga TODO el despliegue: cada "when: sync_result is
      # changed" de aquí abajo mira esto. En check_mode el módulo no ha copiado nada:
      # solo ha mirado y ha dicho si habría cambios. De ahí sale la decisión de hacer
      # backup, de parar el servicio y de sincronizar de verdad.
      ansible.builtin.debug:
        msg:
          habria_cambios:     "{{ sync_result is changed }}"
          que_haria_rsync:    "{{ sync_result.stdout_lines | default([]) }}"
        verbosity:          2
      when:                 sync_result is defined
      tags:
        - despliegue

    - name:             Asegurar que la carpeta de backups existe si es necesaria
      ansible.builtin.file:
        path:           "{{ carpeta_backups }}"
        state:          directory
        mode:           '0755'
      become:           true
      tags:
        - despliegue
      when:             sync_result is changed

    - name:             Backup de la aplciacion que esté cargada actualmente ... si es que hay nueva versión de la aplciación
      community.general.archive:
        path: "{{ aplicacion_a_desplegar.carpeta_despliegue }}"
        dest: "{{ carpeta_backups }}/{{ aplicacion_a_desplegar.nombre_dominio }}-{{ ansible_date_time.iso8601 }}.tgz"
      become:           true    # Escribe en {{ carpeta_backups }}, que es de root
      when:             sync_result is changed
      tags:
        - despliegue

    - name:             Caso que vayamos a desplegar una nueva versión de la aplicación, parar el servicio antes de actualizar
      # De hecho, tampoco deberíamos hacer esto... Puede ser que haya otros virtual hosts corriendo en el mismo servidor.
      # Deberiamos solo de desactivar el virtual host correspondiente a la aplicación que vamos a actualizar.
      ansible.builtin.debug:
        msg: "TODO: Aquí deberíamos parar el virtual host de la aplicación que vamos a actualizar"
      become:           true
      when:             sync_result is changed
      tags:
        - despliegue

    - name:             Asegurar que los archivos de la aplicación web desplegada coinciden con los que he descargado
      ansible.posix.synchronize:
        src:            "/tmp/{{ aplicacion_a_desplegar.nombre_dominio }}/"
        dest:           "{{ aplicacion_a_desplegar.carpeta_despliegue }}"
        delete:         true
      delegate_to:      "{{ inventory_hostname }}"  # Nodo destino... así la carpeta src se toma del nodo de destino
      # Cuál es la dirección IP o nombre del nodo de destino en el que estamos ejecutando el playbook: 
      # Ansible me regala una variable con ese dato: inventory_hostname
      notify:           NUEVA_VERSION_APP_DESPLEGADA
      become:           true
      when:             sync_result is changed
      tags:
        - despliegue


# Otros (Configuracion del servicio, abrir puertos de firewall)

- name:                 Asegurar que el apache quede configurado para arranque automático (para el siguiente reinicio)
  ansible.builtin.service:
    name:               "{{ nombre_paquete_apache[familia_sistema_operativo] }}"
    enabled:            true
  become:               true
  tags:
    -                   always

- name:                 Asegurar que el apache quede arrancado
  ansible.builtin.service:
    name:               "{{ nombre_paquete_apache[familia_sistema_operativo] }}"
    state:              started
  become:               true
  tags:
    -                   always

- name:                 Asegurar que el puerto del apache queda abierto en el firewall 
  ansible.builtin.include_tasks:  
    file:               "{{ familia_sistema_operativo }}/reglas-firewall.yaml"
    apply:
      tags:
        -               always
  tags:
    -                   always

