  - ubuntu
  - redhat

nombre_paquete_apache: 
  redhat:       httpd
  ubuntu:       apache2

carpetas_configuracion_apache:
  redhat:       /etc/httpd/conf.d
  ubuntu:       /etc/apache2/sites-enabled

carpeta_backups: /var/apache/backups

