apache: 
  # Versión por defecto, con independencia de la distro
  version:
    name:              2.4.7
    matching:         ">="
  redhat:
    # A nivel de cada distro puede forzar otra verisón si lo quiere
    # version:
    #    name          2.4.7
    #    matching:     ">="
    #repo:
    #  name:
    #  url:  
    #  gpgkey:
  ubuntu:
    # version:          2.4.7
    # version_matching: ">="
    repo:
      name:
      url:  
      gpgkey:           ""


aplicacion_a_desplegar:
  repo_git:               https://github.com/usuario/repositorio.git
  puerto_apache:          80
  nombre_dominio:         example2.com
  carpeta_despliegue:     /var/www/html/app1
  configuracion_apache: |
    # Aquí puedes añadir configuración adicional para el virtual host de Apache
    # Por ejemplo:
    <Directory /var/www/html/app1>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined