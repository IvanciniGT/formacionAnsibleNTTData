apache: 
  # Versión por defecto, con independencia de la distro.
  # 2.4.37 es lo que trae Rocky/RHEL 8, la más vieja de las que soportamos.
  # (Ubuntu 22.04 trae 2.4.52, Rocky 9 trae 2.4.57 y Debian 12 trae 2.4.68: todas cumplen)
  # El 2.4.7 que había aquí no era un mínimo real, era un número: lo cumple cualquier
  # apache de los últimos diez años, así que no protegía de nada.
  version:
    name:              2.4.37
    matching:         ">="
  redhat:
    # A nivel de cada distro puede forzar otra verisón si lo quiere
    # version:
    #    name          2.4.7
    #    matching:     ">="
    #repo:
    #  name:
    #  url:  
    #  gpgkey:
  debian:
    # version:          2.4.7
    # version_matching: ">="
    repo:
      name:
      url:  
      gpgkey:           ""


aplicacion_a_desplegar:
  repo_git:               https://github.com/usuario/repositorio.git
  puerto_apache:          80
  nombre_dominio:         example2.com
  carpeta_despliegue:     /var/www/html/app1
  configuracion_apache: |
    # Aquí puedes añadir configuración adicional para el virtual host de Apache
    # Por ejemplo:
    <Directory /var/www/html/app1>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
  pruebas:
    - url:                /test
      codigo_estado:      200
      contenido:          Sistema funcionando
