
# YAML Es un lenguaje para estructurar información. Eqivalente/Alternativo a lo que serían JSON o XML.
# En YAML podemos poner comentarios: ALELUYA! Con el #.. lo que hay detrás se ignora.

# En un fichero YAML puedo tener muchos DOCUMENTOS YAML.
# En XML o JSON : 1 archvo json o un archivo XML incluye 1 único documento.
# En yaml dentro de un archivo/fichero, puedo tener muchos documentos.
# Cada documento comienza por ---, salvo el primero.
# En ocasiones podéis encontrar un documento con el símbolo ... que indica el final del documento YAML.
# Eso NUNCA SE DEBE PONER EN UN ARCHIVO: ES DE SER DEMASIADO FRIKI! Y de no entender qué hace eso!
# Eso existe para cuando se mandan documentos YAML vía streaming.. por ejemplo en una conexión HTTP o en un flujo de datos continuo.
