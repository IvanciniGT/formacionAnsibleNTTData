# NOTA IMPORTANTE:
# En versiones antiguas de YAML (hoy en día estamos en la spec1.2 de YAML), se admitían como booleanos:
# yes    # YES Yes y
# no     # NO No n
# on     # ON On
# off    # OFF Off
# ESO SE ELIMINO AL CREAR LA SPEC 1.2... LA CAGARON, debían de haberlo DEPRECADO!Pero no lo hicieron.. directamente lo quitaron de la spec.
# Como muchos documentos dejaban de poder ser leídos, muchos de los programas que leen YAML los siguen reconociendo como booleanos.
# En cuanto vea algo como eso, inmediatamentte lo cambio a true o false según corresponda.
