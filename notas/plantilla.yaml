# Playbook de ansible:
- name: Configurar red
  hosts: all
  vars:
    ansible_network_interfaces: "{{ ansible_facts.interfaces }}"
  pre_tasks:
    - name: Mostrar interfaces de red
      debug:
        var: ansible_network_interfaces
  tasks:
    - name: Configurar red
      ansible.builtin.include_role:
        name: configurar_red
  post_tasks:
    - name: Mostrar interfaces de red después de configurar la red
      debug:
        var: ansible_network_interfaces
  handlers:
    - name: Reiniciar red
      ansible.builtin.service:
        name: networking
        state: restarted
  # Si este archivo se lo paso a netplan FLIPA!

# Cada programa que usaYAML define la estructura concreta que puede tener un documento YAML para ser leído por ese programa.
# ESO ES LO QUE SE DENOMINA ESQUEMA DE YAML.
# Se dice que claves pueden usarse, cuales son obligatorias y 
# cuales son opcionales dentro del esquema de YAML de cada programa, y que tipo de dato admite cada clave.

# Ahora que entendemos la sintaxis de YAML, nuestro siguiente paso es aprender el ESQUEMA YAML que usa ANSIBLE.
