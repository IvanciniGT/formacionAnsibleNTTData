---
["item1", 33, true] # Eso es válido... Y TOTALMENTE DESACONSEJADO = MALA PRACTICA. NO LO USAMOS
# Solo existe por compatibilidad con JSON
# La idea es que YAML Sea 100% compatible con JSON. Dicho de otra forma
# Un lector de YAML puede leer cualquier archivo JSON válido.
# Esa es la idea... Hay un caso que no lo cumple.

# Problmas de esa sintaxis: 
# - Más dicifil de leer
# - Este archivo acabará en GIT y GIT identifica cambios línea por línea, lo que puede generar conflictos innecesarios.

# Solo hay un escenario legítimo para esa sintaxis:
---
[] # Lista vacía. No hay alternativa. Aquí si se usan los corchetes.
---
# Mapas desordenados (diccionarios, arrays asociativos, objetos JSON)
# Colección clave valor.
clave1:       valor1
clave2:       33       # Aqui 33, porque 34 no funciona!
clave3:       true
clave4:
            - subitem1
            - subitem2
clave5: 
  subclave1:  valor1
  subclave2:  valor2
---
# OJO: DESORDENADO
clave1: valor1
clave2: 33
clave3: true
---
clave2: 33
clave3: true
clave1: valor1
# Desde el punto de vista YAML esos dos documentos son equivalentes, ya que los mapas desordenados no tienen un orden fijo.
---
#NOTA: Hay una sintaxis alternativa para mapas desordenados, pero no se usa mucho en YAML.
# Ejemplo:
 {clave1: valor1, clave2: 33, clave3: true}

# Esa sintaxis no es muy legible y se recomienda usar la forma estándar de YAML para mapas desordenados.
# Solo está para compatibilidad con JSON.
# Mismos problemas que los []: difícil de leer y propenso a conflictos en GIT.
# Y mismo único caso legítimo es cuando se necesita compatibilidad con JSON.
---
{} # Mapa desordenado vacío. No hay alternativa. Aquí si se usan las llaves.

