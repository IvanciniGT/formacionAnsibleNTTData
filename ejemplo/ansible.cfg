[defaults]
inventory = ./inventario.ini

# Las máquinas del aula son contenedores y regeneran su clave de host en cada
# arranque, así que la comprobación daría un aviso constante.
# En un laboratorio se desactiva. EN PRODUCCIÓN NUNCA.
host_key_checking = False

# Salida legible para clase.
stdout_callback = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
