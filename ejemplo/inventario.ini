# Inventario del alumno.
#
# LOS NOMBRES SON IGUALES PARA TODOS LOS ALUMNOS. Eso es lo que hace que los
# playbooks del profesor funcionen en cualquier entorno sin tocar nada: el
# alias no cambia nunca, sólo ansible_host, que apunta a TU namespace.
#
# Sustituye TU_USUARIO por el tuyo (alumno1, alumno2...). Este mismo fichero,
# ya relleno, lo tienes en tu namespace: ConfigMap "ansible-inventario".

[servidores]
servidor-rocky   ansible_host=servidor-rocky.TU_USUARIO.svc.cluster.local
servidor-ubuntu  ansible_host=servidor-ubuntu.TU_USUARIO.svc.cluster.local

[rocky]
servidor-rocky

[ubuntu]
servidor-ubuntu

[servidores:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/aula
ansible_python_interpreter=/usr/bin/python3
