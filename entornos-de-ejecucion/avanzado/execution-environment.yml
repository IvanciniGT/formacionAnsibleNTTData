version: 3

build_arg_defaults:
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: '--pre'

dependencies:
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  python:
    - passlib
  system:
    - iproute            # para comandos como ip a/ip route
    - iputils            # para ping
    - curl               # para probar conectividad http
    - openssh-clients    # para ssh y scp
    - sshpass            # si lo usas en tu inventario
    - python3.12
    - python3.12-devel
  galaxy:
    collections:
    - name: ansible.posix
    - name: community.general
    - name: kubernetes.core
images:
  base_image:
    name: registry.fedoraproject.org/fedora:38

    #- RUN python3 -m ensurepip
    #- RUN python3 -m pip install --upgrade pip
    #- RUN python3 -m pip install passlib
    #- RUN dnf install openssh-clients -y
    #- RUN dnf install -y sshpass

 